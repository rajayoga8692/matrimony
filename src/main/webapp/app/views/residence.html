 
    <div class="breadcrumbs">
		<div class="container">
			<h1 class="pull-left">Residence</h1>
			 	    <a  href="#/admin" class="btn btn-primary pull-right" style="margin-top: 10px;">Back</a>
			 
		</div> 
	</div>
 <!-- Left Bordered Funny Boxes -->
<div class="container content-sm" ng-controller="residencectrl">
	<form class="form-horizontal" novalidate="novalidate">
		<div class="row">
			<div class="shadow-wrapper">
				<div class="tag-box tag-box-v1 box-shadow shadow-effect-2"
					style="padding: 60px">
					<div class="col-md-offset-3 col-md-5">
						<input type="text" ng-model="residencenamenew"
							class="form-control" placeholder="Residence name">
					</div>
					<div class="col-md-3">
						<button class="btn-u btn-u-purple" type="button"
							ng-click="saveResidence()">Submit</button>
					</div>
				</div>
			</div>
		</div>
		<div class="row">
			<div class="  panel panel-red margin-bottom-40">
				<div class="  panel-heading">
					<h3 class="panel-title">
						<i class="fa fa-user"></i> Residence
					</h3>
				</div>
				<div class="panel-body">
					<table class="table">
						<thead>
							<tr>
								<th>#</th>
								<th>Residence Name</th>
								<th>Edit</th>
								<th>Delete</th>
							</tr>
						</thead>
						<tbody>
							<tr ng-repeat="residencelist in residencelist">
								<td>{{$index+1}}</td>
								<td>{{residencelist.residencename}}</td>
								<td><i class="fa fa-pencil"
									ng-click="editresidence(residencelist)"></i></td>
								<td><i class="fa fa-trash-o" aria-hidden="true"
									ng-click="deleteresidence(residencelist)"></i></td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</form>


	<div class="modal fade" id="myModal" tabindex="-1" role="dialog"
		aria-labelledby="exampleModalLabel" aria-hidden="true">
		<div class="modal-dialog" role="document">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="exampleModalLabel">Modal title</h5>
					<button type="button" class="close" data-dismiss="modal"
						aria-label="Close">
						<span aria-hidden="true">&times;</span>
					</button>
				</div>
				<div class="modal-body">
					<div class="row">
					<div class="col-md-offset-3 col-md-5">
						<input type="text" ng-model="residencename" class="form-control"
							placeholder="Residence name"> <input type="hidden"
							ng-model="residenceid" class="form-control"
							placeholder="Residence name">
					</div>
					<div class="col-md-3">
						<button class="btn-u btn-u-purple" value="{{residencename}}"
							type="button" ng-click="updateResidence(residencelist)">Update</button>
					</div>
					</div>  
				</div>
				<div class="modal-footer">
					<!-- <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary">Save changes</button> -->
				</div>
			</div>
		</div>
	</div>


	<!-- End Left Bordered Funny Boxes -->
</div>
<!--/container-->
