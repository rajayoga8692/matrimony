 
    <div class="breadcrumbs">
		<div class="container">
			<h1 class="pull-left"> Country</h1>
			<a  href="#/admin" class="btn btn-primary pull-right" style="margin-top: 10px;">Back</a>
			 
		</div> 
	</div>
 <!-- Left Bordered Funny Boxes -->
    <div class="container content-sm" ng-controller="countryctrl">
    <form class="form-horizontal" novalidate="novalidate">
        <div class="row">
               <div class="shadow-wrapper">
                   <div class="tag-box tag-box-v1 box-shadow shadow-effect-2" style=" padding: 60px">
                   
                         <div class="col-md-offset-3 col-md-5"> 
                         	<input type="text" ng-model="countrynamenew" class="form-control" placeholder="Country name">  
                          </div>
                          <div class="col-md-3"> 
                          	<button class="btn-u btn-u-purple"  type="button" ng-click="saveCountry()">Submit</button> 
                          </div>
                   </div>
               </div> 
 	     </div>  
 	     <div class="row">
 	     	<div class="  panel panel-red margin-bottom-40">
                    <div class="  panel-heading">
                        <h3 class="panel-title"><i class="fa fa-user"></i> Country</h3>
                    </div>
                    <div class="panel-body">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Country Name</th>
                                    <th>Edit</th>
                                    <th>Delete</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="countrylist in countrylist">
                                     <td>{{$index+1}}</td>
                                    <td>{{countrylist.countryname}}</td>
                                    <td ><i class="fa fa-pencil" ng-click="editcountry(countrylist)"></i></td> 
                                    <td><i class="fa fa-trash-o" aria-hidden="true" ng-click="deletecountry(countrylist)"></i></td>
                                  </tr>
                              </tbody>
                        </table>
                    </div>
                </div>
 	     </div>
     </form>

 
	<div class="modal fade" id="myModal" tabindex="-1" role="dialog"  ng-show="mdlview"
		aria-labelledby="exampleModalLabel" aria-hidden="true">
		<div class="modal-dialog" role="document">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="exampleModalLabel">Country Edit</h5>
					<button type="button" class="close" data-dismiss="modal"
						aria-label="Close">
						<span aria-hidden="true">&times;</span>
					</button>
				</div>
				<div class="modal-body">
					<div class="row">
	 					<div class="col-md-offset-3 col-md-5">
							<input type="text" ng-model="countryname" class="form-control"
								placeholder="Country name"> <input type="hidden"
								ng-model="countryid" class="form-control"
								placeholder="Country name">
						</div>
						<div class="col-md-3">
							<button class="btn-u btn-u-purple" value="{{countryname}}"
								type="button" ng-click="updateCountry(countrylist)">Update</button>
						</div>
					</div>
				</div>    
				<div class="modal-footer">
					<!-- <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary">Save changes</button> -->
				</div>
			</div>
		</div>
	</div>


	<!-- End Left Bordered Funny Boxes -->
  </div><!--/container-->
