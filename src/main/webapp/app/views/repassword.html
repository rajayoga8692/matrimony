<link rel="stylesheet" href="./assets/css/pages/profile.css">
<style>
.rasi {
	font-style: italic;
	color: coral;
	padding-right: 40px;
}

.tbl {
	height: 80px;
	width: 90px;
	text-align: center
}
</style>
<!--=== Profile ===-->
<div class="breadcrumbs">
	<div class="container">
		<h1 class="pull-left">  
			 <i class="fa fa-lock"></i> Reset Password
		</h1>
	</div>
</div>
<div class="container content profile" ng-controller="profilectrl">
	<div class="row">
	<div class="col-md-3 md-margin-bottom-40   profile" style="padding-top:10px" > 
					<div class="card hovercard">
						<div class="cardheader"></div>
						<div class="avatar">
							<img alt="" src="././OpenFile?r1=serverpath&r2={{user.photo }}">
						</div>
						<div class="info" style="margin-bottom: 10px;"> 
							<div class="title">
								<a target="_blank">{{user.name}}</a>
							</div> 
							<div class="desc" ><span class="label rounded label-warning">{{user.registerno}}</span> </div>
		 					                            <ul class="list-inline badge-lists " style="margin-top:15px">
		 					<li>
		                                    <a class="btn-u btn-u-xs btn-u-dark" href="#">Contacts</a>
		                                     <span class="badge badge-red rounded-2x">{{user.updatecount}}</span>
		                                </li></ul>
							 
		 				</div>
					</div>
					<ul class="list-group sidebar-nav-v1 "
						id="sidebar-nav-1">
		   
						<li class="list-group-item  " ng-class="getClass('/profile')">
							<a href="#/profile"><i class="fa fa-user"></i>Profile</a>
						</li>
						<li class="list-group-item" ng-class="getClass('/paymenthistory')">
							<a href="#/paymenthistory"><i class="fa fa-money"></i>Payment
								Details</a>
						</li>
						<li class="list-group-item" ng-class="getClass('/viewedyourhistory')">  
							<a href="#/viewedyourhistory/rprofile"><i class="fa fa-eye"></i>Recent Viewd by</a>
						</li>
						<li class="list-group-item" ng-class="getClass('/viewedhistory')">
							<a href="#/viewedhistory"><i class="fa fa-history"></i>History</a>
						</li>
						<li class="list-group-item " ng-class="getClass('/likedhistory')">
							<a href="#/likedhistory"><i class="fa  fa-heart"></i>Favorites</a>
						</li>	
						<li class="list-group-item " ng-class="getClass('/likedbyhistory')">
							<a href="#/likedbyhistory"><i class="fa fa-thumbs-up"></i>Shortlist By </a> 
						</li>
						 
						<li class="list-group-item active" ng-class="getClass('/repassword')">
							<a href="#/repassword"><i class="fa fa-lock"></i>Change
								Password</a>
						</li> 
					</ul>     
					<div class="headline">   
						<h2>VIP Profiles</h2>
					</div>  
					<div class=" ">       
				      <carousel interval="myInterval">  
				        <slide ng-repeat="sliderlist in sliderlist" >
				          <img class="img-responsive" ng-src="./OpenFile?r1=serverpath&r2={{sliderlist.imagepath}}" style="width:400px;height:400px;margin:auto;">
				          <div class="carousel-caption">
				            <h4 style="color: white;">{{sliderlist.registerid}}</h4>
				          </div>
		 		        </slide>  
				      </carousel>    
				    </div>
				</div>   
			<div class="col-md-9">
				<div class="col-md-6"style="border: 29px solid #EAE8E8;box-shadow: 18px 5px 5px #888888;border-radius: 61px;margin-bottom: 68px;">
						<div class="row">
							<div class="col-md-12" 
								style="font-size: 16px;;background-color:#72c02c; border-top-left-radius: 45px; border-top-right-radius: 89px; min-height:25px;">
								<font color="#ffffff"><i class="fa fa-briefcase">&nbsp;&nbsp;</i>Change Password</font>
							</div>  
						<div class="" >
 							<p>Enter Your Old Password</p>
							<br> 
							<div class="row">
								<section>
									<label class="col-md-4 control-label">Old Password</label>
									<div class="col-md-6">
										<input type="text" ng-model="_update.password1"
											ng-match="_update.password"
											class="form-control input-sm required textbox1">

									</div>
								</section> 

							</div>
							<div class="row" style="margin-top: 38px;">
								<div class="col-md-5"></div>
								<div class="col-md-6">
									<button type="button" style="background: #72c02c;"
										class="btn-u" ng-click="passwordcheck()">Submit</button>
								</div>
								<div class="col-md-2"></div>
							</div>
						</div>
						<div class="" ng-show="newpassword">
  
							<div class="row">
								<section>
									<label class="col-md-4 control-label">New Password</label>
									<div class="col-md-6">
										<input type="text" ng-model="password" name="password"
											class="form-control input-sm required">
									</div>
								</section>
							</div>

							<div class="row" style="margin-top: 38px;">
								<div class="col-md-5"></div>
								<div class="col-md-6">
									<button type="button" style="background: #72c02c;"
										class="btn-u" ng-click="newpass(_update.p_id)">Update</button>
								</div>
							</div>
						</div>
					
			
 </div>
 </div> 
			<!-- End Profile Content -->
		</div>
		<!--/end row-->
	</div>
	<!--=== End Profile ===-->
