 <link href="./assets/css/custom-sky-forms.css" rel="stylesheet">
<style>
	.errors{
    margin-top: 6px;
    padding: 0 1px;
    font-style: normal;
    font-size: 11px;
    line-height: 15px;
    color: #ee9393;
    }

<div class="breadcrumbs">
	<div class="container">
		<h1 class="pull-left"><i class="fa fa-search"></i> உள் நுழை  / Login</h1>
	</div>
</div>
<div class="container content" ng-controller="loginctrl">
 <div class="col-md-6">  
		      <carousel interval="myInterval">     
		        <slide ng-repeat="sliderlist in sliderlist" >  
		          <img class="img-responsive" ng-src="./OpenFile?r1=serverpath&r2={{sliderlist.imagepath}}" style="width:400px;height:400px;margin:auto;">
 		        <div class="carousel-caption">
		            <h4 style="color: white;">{{sliderlist.registerno}}</h4>
		          </div> 
 		        </slide>  
		      </carousel>     
		    </div>
<div class="col-md-6 "  cg-busy="{promise:promise,templateUrl:templateUrl,message:message,backdrop:backdrop,delay:delay,minDuration:minDuration}">
	<form  name="loginform" id="loginform" class="sky-form" novalidate="novalidate">
		<header ><font color="#666">உங்கள் வாழ்க்கை துணையை தேட</font></header>

		<fieldset> 
			<section>
				<div class="row">
					<label class="label col col-4">Memeber ID / User Name</label>
					<div class="col col-8">
						<label class="input">
							<i class="icon-append fa fa-user"></i>  
							<input type="text" name="username" ng-model="authen.username" required>
							<b class="tooltip tooltip-bottom-right">Needed to enter the username or member Id</b>
						</label>
					</div>
				</div>
			</section>

			<section>
				<div class="row">
					<label class="label col col-4">Password</label>
					<div class="col col-8">
						<label class="input">
							<i class="icon-append fa fa-lock"></i>
							<input type="password" name="pwd" ng-model="authen.pwd" required>
							<b class="tooltip tooltip-bottom-right">Needed to enter the password</b>
						</label>
						<!-- <div class="note"><a href="#sky-form2" class="modal-opener">Forgot password?</a></div> -->
					</div>
				</div>
			</section>

			<section>
				<div class="row">
					<div class="col col-4"></div>
					<div class="col col-8">
						<label class="checkbox"><input type="checkbox" name="remember" checked=""><i></i>Keep me logged in</label>
					</div>
				</div>
				<em class="errors">{{invalid}}</em> 
			</section>
		</fieldset>
		<footer>
			<button type="submit" class="btn-u" ng-click="authenticate()">உள் நுழை / Log in</button>
			<a href="#/registration" class="btn-u btn-u-blue">பதிவு செய்ய / Register</a>
		</footer>
	</form>
