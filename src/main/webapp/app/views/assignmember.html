	<div class="container">   
		<h1 class="pull-left"><i class="fa fa-user"></i> Payment Plan</h1>
	<a  href="#/admin" class="btn btn-primary pull-right" style="margin-top: 10px;">Back</a>
	</div>

<div class="container content" ng-controller="assignplanctrl"
	cg-busy="{promise:promise,templateUrl:templateUrl,message:message,backdrop:backdrop,delay:delay,minDuration:minDuration}">
 
	<div class="profile-body">
		<br>
		<div class="row">

			<div class="col-md-5">

				<div class="form-group row">
 					<label class="col-sm-4 col-form-label">Registration No</label>
					<div class="col-sm-8"><div class="input-group">
						<input type="text" ng-model="serarchData.memberid"
							class="form-control" placeholder="Search for..."> <span
							class="input-group-btn">
							<button class="btn btn-primary" type="button"
								ng-click="searchAssignedMeber()">Get</button>
						</span>
					</div>
					</div>
 				</div>
 				<div class="form-group row">
					<label class="col-sm-4 col-form-label">Payment Plan</label> 
					<div class="col-sm-8"><label class="select"><select ng-options='planDetails.planname for planDetails in planDetails'
						name="plan" ng-model="planid" ng-change="showPlandettail(planid)"> 
						    <option value="" >--Select paymentplan--</option>
 						</select> </label></div>
				</div>
				<div class="form-group row">
					<label class="col-sm-4 col-form-label">Username</label>
					<div class="col-sm-8">
						<label class="col-form-label"> : {{moreInfo.username}}</label>
					</div>
				</div>
				<div class="form-group row">
					<label class="col-sm-4 col-form-label">Password</label>
					<div class="col-sm-8">
						<label class="col-form-label"> : {{moreInfo.password}}</label>
					</div>
				</div>
				<div class="form-group row" ng-show='freePlan'>
					<label class="col-sm-4 col-form-label">Extra Contacts</label>
					<div class="col-sm-8">
						<label class="col-form-label"> : <input type="text" name="econtacts" ng-model="econtacts"
										maxlength="45"  ></label>
					</div>
				</div>
				<div class="form-group row" ng-show='freePlan'>
					<label class="col-sm-4 col-form-label">Extra Period</label> 
					<div class="col-sm-8">
						<label class="col-form-label"> : <input type="text" name="vdays" ng-model="vdays"
										maxlength="45"  >  
										
									 </label>
					</div>
				</div>
					<div class="form-group row" ng-show='freePlan'>
						<label class="col-sm-4 col-form-label">Days type</label>
						<div class="col-sm-7" style="padding-left: 0px">
							<label class="col-form-label"> &nbsp;&nbsp;&nbsp; : <select name="vtype" id="vtype" ng-model="vtype"
								  style="width: 57px;">
								<option value="d" selected>Days</option>
								<option value="m">Months</option>

							</select>
							</label> 
						</div>
					</div>
					<div class="form-group row">
 					<div class="col-sm-8">
						<label class="col-form-label"> <button type="submit" class="btn-u" ng-click="signup(planDetails.planid,'new',planDetails.contacts)">Submit</button>
										 </label>
					</div>
				</div>
				</form>  
			</div>

									</div>
								</div>
								<div class="form-group row">

								</div>

								</div>
								<div class="form-group row">

									<div class="col-sm-8">

								</div>

				</div>
				<!--/end row-->
			</div>
			
			 
			<div class="col-md-3">
				<div class="profile-bio">
					<img class="img-responsive md-margin-bottom-10"
						style="width: 260px; height: 250px; padding-bottom: 20px;"
