 
<div ng-controller="aprofilectrl">
	<div class="breadcrumbs">
		<div class="container">
			<h1 class="pull-left">
				<i class="fa fa-user"></i> Welcome, {{user.name}}
			</h1>
			<a href="#/approveprofile" class="btn btn-primary pull-right"
				style="margin-top: 10px;">Back</a>
		</div>
	</div>
 	<div class="container content"
		cg-busy="{promise:promise,templateUrl:templateUrl,message:message,backdrop:backdrop,delay:delay,minDuration:minDuration}">
		
 		<div class="row">
               <div class="shadow-wrapper">
                   <div class="tag-box tag-box-v1 box-shadow shadow-effect-2" style=" padding: 60px">
                         <div class="col-md-offset-3 col-md-5"> 
                         	<input ng-model="keyItem" id="keyItem" class="form-control" placeholder="Name,Register no,Gender,Education">
                          </div>
                          <div class="col-md-3"> 
                          	<button href="#" class="btn btn-info " ng-click="searchProfile()"> <i class="fa fa-search"></i> Search</button> 
                          </div>
                   </div>
               </div> 
 	     </div> 
		
		<div class="" style="margin-top: 10px;">
             
 			<div class="col-xs-4 pull-right" >
              <label for="search">Search:</label>
              <input ng-model="searchData" id="search" class="form-control" placeholder="Filter text">
            </div>
 			<div class="col-lg-12">
 				<div class="bs-component">
					<table class="table table-striped table-hover">
						<thead>
							<tr>
								<th>Sl.No.</th>
								<th>Name</th>
								<th>Age</th>
								<th>Registration No</th>
								<th>Registration ID</th>
								<th width="10%">Education</th>
								<th width="10%">Sex</th>
								<th>Action</th>
							</tr>
						</thead>
						<tbody>
							<tr ng-show="data.userSearchData.length <= 0">
								<td colspan="5" style="text-align: center;">Loading new
									data!!</td>
							</tr>
							<tr ng-repeat="user in data.userSearchData | filter:searchData">
								<td>{{$index+1}}</td>
								<td>{{user.name}}</td>
								<td>{{getDate(user.dateofbirth)}}</td>
								<td>{{user.registerno}}</td>
								<td>{{user.registerid}}</td>
								<td width="10%">{{user.education}}</td>
								<td width="10%">{{user.gender}}</td>
								<td width="25%">
									<a href="#/updateprofile/{{user.id}}/0"
										class="btn btn-info btn-xs"> <i class="fa fa-share"></i> More
											Details
									</a>
									<a href="#/viewprofile/{{user.registerno}}"
										class="btn btn-info btn-xs"> <i class="fa fa-print"></i>
											Print
									</a>
									<button class="btn btn-danger btn-xs"
										ng-click="deactivate(user.id,'D')">
										<i class="fa fa-trash-o"></i> Deactive
									</button>
								</td>
							</tr>
						</tbody>
					</table>
 				</div>
			</div>
		</div>
	</div>
</div>
